<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="water4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sky4)"/>
  <rect y="185" width="400" height="65" fill="url(#water4)"/>
  <g stroke="#E0F2FE" stroke-width="2" opacity="0.35" fill="none">
    <path d="M0 205 Q40 200 80 205 T160 205 T240 205 T320 205 T400 205"/>
    <path d="M0 225 Q40 220 80 225 T160 225 T240 225 T320 225 T400 225"/>
  </g>

  <g fill="#065F46">
