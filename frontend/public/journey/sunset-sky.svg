<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sunset)"/>
  <circle cx="330" cy="95" r="42" fill="#FDE68A" opacity="0.95"/>
  <path d="M0 195 Q100 185 200 197 T400 190 V250 H0 Z" fill="#111827" opacity="0.9"/>

  <!-- full train silhouette (backlit, no window detail, pure motion shape) -->
  <g fill="#111827">
    <rect x="55" y="150" width="80" height="40" rx="6"/>
    <rect x="143" y="150" width="80" height="40" rx="6"/>
    <rect x="231" y="138" width="86" height="52" rx="10"/>
    <path d="M317 143 Q334 148 334 164 Q334 180 317 181 Z"/>
    <rect x="258" y="112" width="12" height="26" rx="2"/>
  </g>
  <g fill="#78350F" opacity="0.6">
    <circle cx="70" cy="192" r="8"/>
    <circle cx="118" cy="192" r="8"/>
    <circle cx="158" cy="192" r="8"/>
    <circle cx="206" cy="192" r="8"/>
    <circle cx="252" cy="192" r="9"/>
    <circle cx="296" cy="192" r="9"/>
  </g>

  <!-- smoke trailing back and up -->
  <g fill="#F8FAFC" opacity="0.5">
    <circle cx="262" cy="100" r="8"/>
    <circle cx="250" cy="88" r="11"/>
    <circle cx="234" cy="74" r="14"/>
    <circle cx="212" cy="62" r="16"/>
  </g>

  <!-- speed lines -->
  <g stroke="#FDE68A" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="6" y1="158" x2="52" y2="158"/>
    <line x1="0" y1="170" x2="58" y2="170"/>
    <line x1="10" y1="182" x2="48" y2="182"/>
  </g>

  <!-- birds -->
  <g stroke="#111827" stroke-width="2" fill="none" opacity="0.7">
    <path d="M60 60 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M140 90 q8 -8 16 0 q8 -8 16 0"/>
  </g>
</svg>
