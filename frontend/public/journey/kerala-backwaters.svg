    <ellipse cx="8" cy="94" rx="18" ry="7" transform="rotate(-20 8 94)"/>
    <ellipse cx="22" cy="86" rx="18" ry="7" transform="rotate(10 22 86)"/>
    <path d="M368 185 Q374 128 396 98" stroke="#78350F" stroke-width="4" fill="none"/>
    <ellipse cx="400" cy="92" rx="18" ry="7" transform="rotate(20 400 92)"/>
    <ellipse cx="384" cy="82" rx="18" ry="7" transform="rotate(-10 384 82)"/>
  </g>

  <!-- causeway the train crosses over the water -->
  <rect x="0" y="178" width="400" height="10" fill="#94A3B8"/>
  <rect x="0" y="188" width="400" height="4" fill="#78350F" opacity="0.7"/>

  <!-- train + water reflection -->
  <g>
    <g>
      <rect x="60" y="140" width="78" height="38" rx="6" fill="#0F172A"/>
      <rect x="70" y="148" width="14" height="12" rx="2" fill="#BAE6FD"/>
      <rect x="92" y="148" width="14" height="12" rx="2" fill="#BAE6FD"/>
      <rect x="114" y="148" width="14" height="12" rx="2" fill="#BAE6FD"/>
      <rect x="60" y="172" width="78" height="4" fill="#F97316"/>
    </g>
    <g>
      <rect x="146" y="140" width="78" height="38" rx="6" fill="#0F172A"/>
      <rect x="156" y="148" width="14" height="12" rx="2" fill="#BAE6FD"/>
      <rect x="178" y="148" width="14" height="12" rx="2" fill="#BAE6FD"/>
      <rect x="200" y="148" width="14" height="12" rx="2" fill="#BAE6FD"/>
      <rect x="146" y="172" width="78" height="4" fill="#F97316"/>
    </g>
    <g>
      <rect x="232" y="128" width="84" height="50" rx="10" fill="#0F172A"/>
      <path d="M316 133 Q332 138 332 154 Q332 170 316 171 Z" fill="#0F172A"/>
      <rect x="244" y="137" width="24" height="16" rx="2" fill="#BAE6FD"/>
      <rect x="274" y="137" width="18" height="16" rx="2" fill="#BAE6FD"/>
      <rect x="232" y="170" width="100" height="6" fill="#F97316"/>
    </g>
    <g fill="#111827">
      <circle cx="78" cy="178" r="8"/>
      <circle cx="120" cy="178" r="8"/>
      <circle cx="164" cy="178" r="8"/>
      <circle cx="206" cy="178" r="8"/>
      <circle cx="254" cy="178" r="9"/>
      <circle cx="298" cy="178" r="9"/>
    </g>

    <!-- reflection, flipped and faded -->
    <g opacity="0.25" transform="scale(1,-1) translate(0,-380)">
      <rect x="60" y="140" width="78" height="38" rx="6" fill="#0F172A"/>
      <rect x="146" y="140" width="78" height="38" rx="6" fill="#0F172A"/>
      <rect x="232" y="128" width="84" height="50" rx="10" fill="#0F172A"/>
